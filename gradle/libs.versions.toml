[versions]
# Bump deliberately, together with app/build.gradle.kts compileSdk/targetSdk
# and flake.nix's Android SDK pin — not automatically.
agp = "9.3.0"
kotlin = "2.4.10"
coreKtx = "1.19.0"
lifecycle = "2.11.0"
activityCompose = "1.13.0"
composeBom = "2026.08.00"
datastorePreferences = "1.2.0"
kotlinxSerializationJson = "1.9.0"
junit = "4.13.2"
# Shared by both the -core and -test artifacts below: they need to stay
# in lockstep, and this used to be only kotlinxCoroutinesTest even
# though -core was already in use (see kotlinx-coroutines-core's own
# comment).
kotlinxCoroutines = "1.10.2"
truth = "1.4.5"
# Instrumented tests only (app/src/androidTest). Kept apart from the JVM
# test versions above because they run somewhere else entirely — on a
# device or emulator, against the real framework.
androidxTestJunit = "1.2.1"
androidxTestRunner = "1.6.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastorePreferences" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
# Explicit now (wiki/open-threads.md): RuleEngine.kt imports Dispatchers/
# withContext/withTimeoutOrNull directly from domain/ code, not just
# tests, but until this line existed it compiled only because
# androidx.lifecycle-runtime-ktx and Compose runtime happen to pull the
# same artifact in transitively. Declaring it here means domain/'s only
# non-Kotlin-stdlib import no longer rests on a dependency graph nothing
# in this file actually names.
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }
# AGENTS.md §3 names app/src/androidTest as the tool for framework facts
# and wiring — the things a JVM test structurally cannot reach. These two
# are the whole of what that needs: a JUnit4 runner that runs on a device,
# and ApplicationProvider for a real Context. No Espresso (no UI test yet),
# no Robolectric (a real emulator ships in the dev shell, and a simulated
# framework is the wrong place to learn framework facts).
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# No kotlin-android entry: AGP 9's Kotlin support is built in, and applying
# org.jetbrains.kotlin.android on top is a hard error. The "kotlin" version
# above still pins the compose/serialization compiler plugins below.
# See https://kotl.in/gradle/agp-built-in-kotlin
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
