#
# Version metadata only — no gradlew/gradlew.bat/gradle-wrapper.jar are
# committed (see flake.nix: the Nix dev shell's `gradle` on PATH is the
# supported way to build). This file exists solely so IDE tooling built on
# the Gradle Tooling API (vscjava.vscode-gradle, fwcd.kotlin) can discover a
# compatible Gradle version instead of falling back to their own bundled
# default, which can be older than what the Android Gradle Plugin requires.
# Keep this version in sync with the `gradle_9` package pinned in flake.nix.
#
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.7.1-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
