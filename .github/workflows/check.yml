name: check

# Equivalent of the flake-check workflow in nixos-configs, adapted for a
# Gradle/Android project rather than a NixOS-hosts flake: same idea
# (build the dev shell via Nix, then run the actual build/test commands a
# contributor would run by hand -- see flake.nix's shellHook) but there's
# no justfile, module tree, or lint ratchet here to mirror, since this
# repo doesn't have them.
#
# Runs inside `nix develop` rather than a Java/Android setup action so CI
# uses the exact same JDK/Kotlin/Gradle/SDK versions pinned in flake.nix
# -- no separate version matrix to keep in sync by hand.
#
# assembleDebug (not release): release builds need signing config from
# env vars that don't exist in CI (see app/build.gradle.kts) and aren't
# a build error to skip -- see AGENTS.md §5. testDebugUnitTest runs
# whatever JVM unit tests exist under app/src/test; there are none yet
# as of Phase 0, so this currently just proves the empty test task
# doesn't break.
#
# lintDebug/lintRelease run below despite the above: Android Lint only
# analyzes sources/manifest/resources, never packages or signs, so
# lintRelease works in CI the same as it does locally with no signing
# config -- unlike assembleRelease, there's no reason to skip it.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    name: gradle assembleDebug + testDebugUnitTest + lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # security-events:write is what upload-sarif below needs to post
    # lintDebug/lintRelease's findings to the repo's code-scanning tab;
    # not covered by this repo's default GITHUB_TOKEN permissions
    # otherwise. contents:read is the actual default, spelled out because
    # naming any `permissions:` key drops every other one to none.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - name: assembleDebug + testDebugUnitTest (nix develop)
        run: nix develop --command gradle assembleDebug testDebugUnitTest

      # AGENTS.md §4.6, called out by name: "Add a lint check or a simple
      # CI grep asserting android.util.Log appears in exactly one file."
      # Plain grep, no nix/gradle needed -- SafeLog.kt is meant to be the
      # only permitted entry point to Log; a second file using it directly
      # is exactly the failure mode SafeLog exists to make structurally
      # impossible (AGENTS.md §0/§4.6: no arbitrary-string logging path).
      - name: assert android.util.Log usage is confined to one file
        run: |
          hits=$(grep -rl 'android\.util\.Log' app/src --include='*.kt' | wc -l)
          if [ "$hits" -ne 1 ]; then
            echo "::error::android.util.Log is referenced in $hits Kotlin files under app/src; AGENTS.md §4.6 requires exactly one (SafeLog.kt)."
            grep -rl 'android\.util\.Log' app/src --include='*.kt' || true
            exit 1
          fi

      # Android Lint, built into AGP already in use here -- no new
      # dependency to add or ask about, just a task nothing was running.
      # Both variants: lintRelease needs no signing config (lint only
      # analyzes sources/manifest/resources, never packages or signs),
      # so it runs the same in CI as assembleRelease deliberately can't
      # (see this file's header comment on why assembleRelease is skipped).
      - name: lintDebug + lintRelease (nix develop)
        run: nix develop --command gradle lintDebug lintRelease

      # Surfaces lint's findings in the PR's "Files changed"/Security tab
      # via GitHub's code scanning, instead of only a build-log grep --
      # existing tool's own report, not a second analysis.
      - name: upload lint results to code scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: |
            app/build/reports/lint-results-debug.sarif
            app/build/reports/lint-results-release.sarif
